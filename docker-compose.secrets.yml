# on through COMPOSE_FILE in .env. docker inspect shows the environment, so the key comes in as a file
services:
  endlessh:
    environment:
      API_TOKEN_FILE: /run/secrets/api_token
    # a webhook secret works the same way: add webhook_auth here and below, set WEBHOOK_AUTH_FILE
    secrets:
      - api_token

secrets:
  api_token:
    # 0644 inside a 0700 directory: the container's uid can read it, other host users cannot
    file: ./secrets/api_token
