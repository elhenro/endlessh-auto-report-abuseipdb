name: docker

# master -> :edge and :latest, tag vX.Y.Z -> :X.Y.Z / :X.Y. the base images are pinned by digest, so a
# fix reaches users when its dependabot bump is merged, and that has to reach :latest, which compose pulls.
# the weekly run scans the same image against a fresh vulnerability database
# actions are pinned to commit SHAs; dependabot bumps them and the version comments
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # read-only token: nothing here can publish, and no build cache leads from here to publish.
  # this job is the gate of :latest, so it runs everything that has to hold: tests, known
  # vulnerabilities in the crates, and the scan of the image, which sees the crates through cargo-auditable
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --locked
      - name: known vulnerabilities in Cargo.lock
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: scan:local
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    needs: scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # the signed build attestation: gh attestation verify oci://<image> --owner elhenro
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      # built from scratch every time: a shared cache could hand this job layers nobody here built
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
