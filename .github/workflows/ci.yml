name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # advisories appear without any push
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rustfmt, clippy, tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: shellcheck
        run: shellcheck -x install.sh systemd/install.sh
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - name: compose file is valid
        run: cp .env.example .env && docker compose config -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: known vulnerabilities in Cargo.lock
        run: |
          cargo install cargo-audit --locked
          cargo audit
