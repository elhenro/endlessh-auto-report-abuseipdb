name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -x tarpitReporter.sh install.sh systemd/install.sh lib/*.sh tests/run.sh tests/stub-curl tests/stub-endlessh
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - name: unit tests
        run: ./tests/run.sh
      - name: compose file is valid
        run: cp .env.example .env && docker compose config -q
