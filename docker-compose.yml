# works with any .env. options that need setup live in the other docker-compose.*.yml, turned on
# through COMPOSE_FILE in .env; the installer does that on a fresh install
services:
  endlessh:
    image: ghcr.io/elhenro/endlessh-auto-report-abuseipdb:latest
    build: .
    container_name: endlessh-reporter
    restart: unless-stopped
    # no init: true. this is a single process that handles its own signals, and an init would be a
    # second one under the same uid that a host process can read the container's files through
    ports:
      - "${HOST_PORT:-22}:2222"
    env_file: .env
    environment:
      # the container always listens on 2222; this is the port the world sees
      HOST_PORT: ${HOST_PORT:-22}
    volumes:
      - reported:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    ulimits:
      # one fd per stuck client; a daemon's soft default can be 1024, below TARPIT_MAX_CLIENTS
      nofile: 8192
      # a core file would hold the key
      core: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  reported:
