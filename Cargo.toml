[package]
name = "endlessh-reporter"
version = "2.0.2"
edition = "2021"
rust-version = "1.75"
description = "SSH tarpit that optionally reports visitors to AbuseIPDB and other APIs"
license = "MIT"
publish = false

[dependencies]
# constants only (open flags), no calls into it. already in the tree through socket2
libc = "0.2"
socket2 = "0.6"
# already in the tree through ureq: url checks must parse exactly the way the connection will
url = "2"
# rustls + bundled roots, no openssl and no system ca store needed
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# a panicking thread must take the process down so systemd restarts it
panic = "abort"
